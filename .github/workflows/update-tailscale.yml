name: Auto Update Tailscale Version

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Latest Tailscale Release
        id: latest_ts
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/tailscale/tailscale/releases/latest | jq -r .tag_name)
          echo "latest_version=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest Tailscale version is $LATEST_TAG"

      - name: Get Current Configured Version in Dockerfile
        id: current_ts
        run: |
          CURRENT_VER=$(grep -E 'ARG TAILSCALE_VERSION=' tailscale/Dockerfile | cut -d'"' -f2)
          echo "current_version=$CURRENT_VER" >> $GITHUB_OUTPUT
          echo "Current Dockerfile Tailscale version is $CURRENT_VER"

      - name: Update Dockerfile and Config if New Version Available
        if: steps.latest_ts.outputs.latest_version != steps.current_ts.outputs.current_version && steps.latest_ts.outputs.latest_version != ''
        run: |
          NEW_VER="${{ steps.latest_ts.outputs.latest_version }}"
          echo "Updating Tailscale version to $NEW_VER..."
          
          # Update Dockerfile
          sed -i "s/ARG TAILSCALE_VERSION=.*/ARG TAILSCALE_VERSION=\"$NEW_VER\"/" tailscale/Dockerfile
          
          # Bump patch version in config.yaml
          OLD_CONFIG_VER=$(grep -E '^version:' tailscale/config.yaml | awk '{print $2}')
          NEW_CONFIG_VER=$(echo $OLD_CONFIG_VER | awk -F. '{$NF = $NF + 1; print $0}' OFS=.)
          sed -i "s/^version: .*/version: $NEW_CONFIG_VER/" tailscale/config.yaml

      - name: Commit and Push Changes
        if: steps.latest_ts.outputs.latest_version != steps.current_ts.outputs.current_version && steps.latest_ts.outputs.latest_version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tailscale/Dockerfile tailscale/config.yaml
          git commit -m "bump: update Tailscale to ${{ steps.latest_ts.outputs.latest_version }}"
          git push
