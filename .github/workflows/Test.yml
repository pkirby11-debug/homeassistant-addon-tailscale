name: 'Test'

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tailscale/**'
      - '.github/workflows/Test.yml'
  push:
    branches:
      - main
    paths:
      - 'tailscale/**'
      - '.github/workflows/Test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  # Superseded PR pushes can be cancelled; let builds on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ["aarch64", "amd64"]
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Test build
      uses: home-assistant/builder@2026.03.2
      with:
        # This fork has no `image:` key in config.yaml (the Supervisor builds
        # the add-on locally), so the builder cannot derive an image name and
        # would fail with `invalid tag "/:<version>"`. Supply it explicitly.
        # `--test` sets DOCKER_PUSH=false, so nothing is ever pushed.
        args: |
          --test \
          --${{ matrix.arch }} \
          --target tailscale \
          --image "{arch}-addon-tailscale" \
          --docker-hub "ghcr.io/${{ github.repository_owner }}"
