name: 'Test'

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tailscale/**'
      - '.github/workflows/Test.yml'
  push:
    branches:
      - main
    paths:
      - 'tailscale/**'
      - '.github/workflows/Test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  # Superseded PR pushes can be cancelled; let builds on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # home-assistant/builder is deprecated and slated for removal. This fork
      # never publishes images (config.yaml has no `image:` key, so the
      # Supervisor builds the add-on locally), so a plain buildx build with
      # push disabled is both sufficient and a closer match to what actually
      # runs on the user's machine.
      - name: Resolve base image for ${{ matrix.arch }}
        id: base
        run: |
          set -euo pipefail
          BUILD_FROM="$(awk -v key="${ARCH}:" '
            /^build_from:/ { inblock = 1; next }
            /^[^[:space:]]/ { inblock = 0 }
            inblock && $1 == key { print $2; exit }
          ' tailscale/build.yaml)"
          if [ -z "${BUILD_FROM}" ]; then
            echo "::error::No build_from entry for ${ARCH} in tailscale/build.yaml"
            exit 1
          fi
          echo "build_from=${BUILD_FROM}" >> "$GITHUB_OUTPUT"
          echo "Base image: ${BUILD_FROM}"
        env:
          ARCH: ${{ matrix.arch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test build
        uses: docker/build-push-action@v7
        with:
          context: tailscale
          file: tailscale/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.build_from }}
            BUILD_ARCH=${{ matrix.arch }}
